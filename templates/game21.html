<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#064e3b">
  <title>Jogo de 21 — Aiyra</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/game21.css">
</head>
<body class="game-body">
  <main class="game-shell">
    <header class="game-topbar">
      <a class="back-link" href="/" aria-label="Voltar para Aiyra">← Aiyra</a>
      <div><h1>♠ Jogo de 21 ♥</h1><p>Um jogo rápido de cartas, direto no navegador.</p></div>
      <form method="post" action="/logout"><button class="exit-button" type="submit" title="Sair da conta">⇥</button></form>
    </header>
    <section class="table" aria-label="Mesa de blackjack">
      <div class="hand-area"><h2 id="dealer-title">BANCA — ?</h2><div id="dealer-cards" class="cards" aria-label="Cartas da banca"></div></div>
      <div class="table-divider"><span>✦</span></div>
      <div class="hand-area"><h2 id="player-title">JOGADOR — 0 pontos</h2><div id="player-cards" class="cards" aria-label="Suas cartas"></div></div>
      <p id="game-status" class="game-status" role="status" aria-live="polite">Preparando o jogo…</p>
      <div class="game-actions">
        <button id="hit" type="button">Pedir carta</button>
        <button id="stand" type="button" class="secondary">Parar</button>
        <button id="new-game" type="button" class="secondary">Novo jogo</button>
      </div>
      <p class="game-rules">Regras: figuras valem 10, Ás vale 1 ou 11, e a banca compra até chegar a 17 pontos. Jogo recreativo, sem apostas.</p>
    </section>
    <footer><a href="/">Voltar à conversa com a Aiyra</a></footer>
  </main>
  <script src="/static/game21.js"></script>
</body>
</html>
